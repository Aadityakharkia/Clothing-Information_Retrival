<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Clothing Search Engine{% endblock %} | CSD358 IR</title>
  <meta name="description"
    content="Premium Clothing Information Retrieval Engine — VSM lnc.ltc, Positional Indexing, Proximity Search. CSD358 Assignment 1.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>

<body>

  <!-- ── Navigation ─────────────────────────────────── -->
  <nav class="top-nav" id="top-nav">
    <div class="nav-inner">

      <a href="/" class="nav-logo" id="nav-logo-link">
        <span class="logo-sq">IR</span>
        <span class="logo-text">CLOTHING SEARCH<br>ENGINE</span>
      </a>

      <div class="nav-center">
        <span class="nav-rule"></span>
        <div class="nav-pages">
          <a href="/" class="nav-link {% if active_page=='search' %}active{% endif %}" id="nav-link-search">Search</a>
          <a href="/tracer" class="nav-link {% if active_page=='tracer' %}active{% endif %}"
            id="nav-link-tracer">Tracer</a>
          <a href="/vocabulary" class="nav-link {% if active_page=='vocab'  %}active{% endif %}"
            id="nav-link-vocab">Index</a>
        </div>
        <span class="nav-rule"></span>
      </div>

      <div class="nav-right">
        <span class="nav-diamond">◆</span>
      </div>

    </div>
  </nav>

  <!-- ── Page Content ───────────────────────────────── -->
  {% block content %}{% endblock %}

  <!-- ── Footer ─────────────────────────────────────── -->
  <footer class="page-footer">
    <span>CSD358 Information Retrieval Assignment 1</span>
  </footer>

  <!-- ── Document Inspection Modal ─────────────────── -->
  <div class="modal-overlay" id="doc-modal" style="display:none;">
    <div class="modal-box modern-modal-box" id="doc-modal-box">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="modal-body-container" id="modal-body">
        <!-- Dynamically rendered with rich UI -->
      </div>
    </div>
  </div>

  <!-- ── Framework Core Architecture Scripts ─────────── -->
  <script src="/static/js/core/garment-photos.js"></script>
  <script src="/static/js/core/app-state.js"></script>
  <script src="/static/js/core/api-client.js"></script>
  <script src="/static/js/core/router.js"></script>
  <script src="/static/js/core/autocomplete.js"></script>

  <!-- ── Shared Modal Controller ─────────────────────── -->
  <script>
    const modal = document.getElementById('doc-modal');
    const modalClose = document.getElementById('modal-close-btn');
    if (modalClose) {
      modalClose.addEventListener('click', () => modal.style.display = 'none');
    }
    if (modal) {
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    }

    window.switchModalTab = function(tabName) {
      document.querySelectorAll('.modal-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });
      document.querySelectorAll('.modal-tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === `tab-panel-${tabName}`);
      });
    };

    window.openDocModal = async function (docId) {
      modal.style.display = 'flex';
      document.getElementById('modal-body').innerHTML = `
        <div class="modal-loading-state">
          <div class="spinner"></div>
          <p>Loading garment details…</p>
        </div>
      `;
      try {
        const d = await window.apiClient.getDocumentDetails(docId);
        const photoUrl = window.GarmentPhotos ? window.GarmentPhotos.getUrl(d.category, d.title) : '';
        const topTerms = Object.entries(d.term_frequencies || {})
          .sort((a, b) => b[1] - a[1]).slice(0, 24);
        const tokens = (d.tokens || []).slice(0, 80);

        // Extract helpful product attributes from text if available
        const text = d.text || '';
        let fabric = 'Standard Apparel';
        let fit = 'Regular Fit';
        let occasion = 'Casual / Daily Wear';
        
        if (/cotton/i.test(text)) fabric = '100% Cotton / Linen Blend';
        else if (/denim/i.test(text)) fabric = 'Stretch Denim';
        else if (/fleece/i.test(text)) fabric = 'Warm Fleece / Poly-Cotton';
        else if (/polyester/i.test(text)) fabric = 'Quilted Polyester';

        if (/slim fit/i.test(text)) fit = 'Slim Fit';
        else if (/oversized/i.test(text)) fit = 'Oversized Fit';
        else if (/comfort/i.test(text)) fit = 'Comfort Regular';

        if (/festive/i.test(text) || /ethnic/i.test(text)) occasion = 'Festive & Traditional';
        else if (/winter/i.test(text)) occasion = 'Winter & Cold Weather';
        else if (/office/i.test(text)) occasion = 'Office & Smart Casual';

        // Check if doc is selected in results if results view is active
        const isSelected = window.selDocs && window.selDocs.has(docId);

        document.getElementById('modal-body').innerHTML = `
          <div class="modal-product-layout">
            
            <!-- Left: Product Photo & Quick Stats -->
            <div class="modal-product-media">
              <div class="modal-img-card">
                <img src="${photoUrl}" alt="${d.title.replace(/"/g, '&quot;')}" class="modal-product-img" onerror="this.src='https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&w=400&q=80'">
                <div class="modal-img-badges">
                  <span class="m-doc-id">${d.doc_id}</span>
                  <span class="m-category-badge">${d.category}</span>
                </div>
              </div>

              <div class="modal-stats-card">
                <div class="m-stat-row">
                  <span class="m-stat-label">Vector Length (lnc)</span>
                  <span class="m-stat-val">${Number(d.vector_length).toFixed(4)}</span>
                </div>
                <div class="m-stat-row">
                  <span class="m-stat-label">Vocabulary Terms</span>
                  <span class="m-stat-val">${Object.keys(d.term_frequencies || {}).length} unique</span>
                </div>
                <div class="m-stat-row">
                  <span class="m-stat-label">Indexed Tokens</span>
                  <span class="m-stat-val">${(d.tokens || []).length} tokens</span>
                </div>
              </div>

              <button class="modal-select-btn ${isSelected ? 'selected' : ''}" id="modal-select-toggle" onclick="toggleDocFromModal('${d.doc_id}')">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
                <span>${isSelected ? 'Selected for Feedback' : 'Select for Relevance'}</span>
              </button>
            </div>

            <!-- Right: Details & Tabs -->
            <div class="modal-product-content">
              <div class="modal-content-head">
                <div class="modal-header-kicker">${d.category} &bull; Document ${d.doc_id}</div>
                <h2 class="modal-product-title">${d.title}</h2>
              </div>

              <!-- Tabs Header -->
              <div class="modal-tabs-nav">
                <button class="modal-tab-btn active" data-tab="overview" onclick="switchModalTab('overview')">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
                  Garment Overview
                </button>
                <button class="modal-tab-btn" data-tab="terms" onclick="switchModalTab('terms')">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                  Keywords (TF)
                </button>
                <button class="modal-tab-btn" data-tab="positions" onclick="switchModalTab('positions')">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  Positional Tokens
                </button>
              </div>

              <!-- Tab 1: Overview -->
              <div class="modal-tab-panel active" id="tab-panel-overview">
                <div class="modal-specs-grid">
                  <div class="spec-card">
                    <span class="spec-lbl">Fabric / Material</span>
                    <span class="spec-val">${fabric}</span>
                  </div>
                  <div class="spec-card">
                    <span class="spec-lbl">Fit / Style</span>
                    <span class="spec-val">${fit}</span>
                  </div>
                  <div class="spec-card">
                    <span class="spec-lbl">Occasion</span>
                    <span class="spec-val">${occasion}</span>
                  </div>
                  <div class="spec-card">
                    <span class="spec-lbl">Care</span>
                    <span class="spec-val">Machine Washable</span>
                  </div>
                </div>

                <div class="modal-desc-box">
                  <h4 class="modal-subheading">Product Description</h4>
                  <p class="modal-desc-text">${d.text || ''}</p>
                </div>
              </div>

              <!-- Tab 2: Keywords / Term Frequencies -->
              <div class="modal-tab-panel" id="tab-panel-terms">
                <p class="panel-intro-text">Stemmed terms extracted and weighted for lnc.ltc Vector Space retrieval:</p>
                <div class="token-grid modern-token-grid">
                  ${topTerms.map(([t, f]) => `
                    <div class="term-pill">
                      <span class="term-name">${t}</span>
                      <span class="term-count">&times;${f}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Tab 3: Positional Tokens -->
              <div class="modal-tab-panel" id="tab-panel-positions">
                <p class="panel-intro-text">Exact token positions in the inverted index for proximity & phrase queries:</p>
                <div class="token-grid modern-token-grid pos-grid">
                  ${tokens.map(tk => `
                    <div class="pos-pill">
                      <span class="pos-idx">#${tk.pos}</span>
                      <span class="pos-word">${tk.term}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

            </div>

          </div>
        `;
      } catch (e) {
        document.getElementById('modal-body').innerHTML = `
          <div class="modal-error-state">
            <p>Error loading document: ${e.message}</p>
          </div>
        `;
      }
    };

    window.toggleDocFromModal = function(docId) {
      if (!window.selDocs) window.selDocs = new Set();
      const btn = document.getElementById('modal-select-toggle');
      if (window.selDocs.has(docId)) {
        window.selDocs.delete(docId);
        if (btn) {
          btn.classList.remove('selected');
          btn.querySelector('span').textContent = 'Select for Relevance';
        }
      } else {
        window.selDocs.add(docId);
        if (btn) {
          btn.classList.add('selected');
          btn.querySelector('span').textContent = 'Selected for Feedback';
        }
      }

      // Update checkbox in results list if present
      const cb = document.querySelector(`.rel-check[data-id="${docId}"], .rel-doc-checkbox[data-doc-id="${docId}"]`);
      if (cb) cb.checked = window.selDocs.has(docId);

      if (typeof window.updateRocchioBtn === 'function') {
        window.updateRocchioBtn();
      }
    };
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
